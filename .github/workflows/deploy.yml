# Deploy BIZOMAT CAD (the CAD MCP server in opensketch/: MCP, OAuth, the device bridge, installer and update
# endpoints) to its Fly.io app `cados` (Amsterdam, ams).
#
# When it runs (owner's choice, 9 Nov 2026: automatic deploys on merge):
# - automatically on every push to main (a merged pull request) that changes something the server is built from.
#   Pushes that only change docs/, root *.md files or backups/ do not deploy. The tests always run first, and the
#   preflight cannot be overridden on this path. A commit whose message contains [skip ci] is not deployed.
# - by hand: Actions > Deploy to Fly.io (cados) > Run workflow on main, confirm = DEPLOY (to redeploy, to deploy a
#   docs-only change, or with skip_tests / allow_machine_change for an exceptional deploy).
# No other branch, tag or schedule deploys.
#
# It only ever targets the app `cados` (fixed below, not a variable). It never touches the app `bizomat`, DNS or
# Cloudflare.
#
# Repository secrets (Settings > Secrets and variables > Actions):
# - FLY_CADOS_TOKEN: a deploy token for the cados app only (Fly dashboard > cados > Tokens > Create deploy token, or
#   `fly tokens create deploy -a cados`). Until it is set nothing is deployed. Only the steps that run flyctl see it.
# - GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET (optional), OPENSKETCH_ACCESS_CODE (optional), BIZOMAT_ID_CLIENT_SECRET
#   (optional: Sign in with BIZOMAT, opensketch/bizomat_id.py): passed to Fly as the app's secrets when set. There is no
#   server password.
#
# Steps: the tests (tests.yml; skip_tests applies to a deploy by hand only); the preflight (.github/scripts/fly-preflight.py) compares fly.toml
# with the live Machines and stops when the deploy would add or remove a Machine or change its size, memory or region
# (allow_machine_change = YES, by hand only, lets a deliberate change through); then the deploy (--ha=false: the one Machine is
# replaced in place, CAD MCP is offline for about 15-90 s) and a check that https://cados.fly.dev/healthz reports the
# new version within 3 minutes.
#
# One deploy source: no GitHub repository is attached to the cados app in Fly (checked 9 Nov 2026; it used to build every
# push to jogkev-creator/CADOS main). Never attach one: this workflow, with its preflight, is how cados is deployed.
#
# Rollback: `flyctl releases -a cados --image`, then `flyctl deploy -a cados --image <the previous image> --ha=false`
# (README.md, "Recovery and maintenance"). Volume snapshots: Fly dashboard > cados > Volumes.
name: Deploy to Fly.io (cados)

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "backups/**"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to deploy main to production (Fly app cados)
        required: true
        default: ""
      skip_tests:
        description: Deploy without running the tests first (only to bring a stuck site back quickly)
        type: boolean
        default: false
      allow_machine_change:
        description: Type YES only if the deploy is meant to change the Machines (count, size, memory, region)
        required: false
        default: ""

permissions:
  contents: read

env:
  APP: cados

# One deploy at a time. A deploy that is running always finishes; when several merges wait, only the newest runs.
concurrency:
  group: deploy-cados
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push' || (inputs.confirm == 'DEPLOY' && !inputs.skip_tests)
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.confirm == 'DEPLOY') &&
      (needs.test.result == 'success' ||
       (needs.test.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.skip_tests))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The public address (OAuth metadata, pairing and download links). The health checks use cados.fly.dev, the
      # origin that always answers.
      PUBLIC_URL: https://bizomat.ai/cad
    steps:
      - name: Check the token
        env:
          HAS_TOKEN: ${{ secrets.FLY_CADOS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the repository secret FLY_CADOS_TOKEN (Fly dashboard > cados > Tokens > Create deploy token). Nothing was deployed."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Preflight (the deploy keeps the live Machines as they are)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
          # only a deploy by hand can allow a change to the Machines; an automatic deploy never does
          ALLOW_MACHINE_CHANGE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_machine_change || '' }}
        run: python3 .github/scripts/fly-preflight.py --app "$APP" --config fly.toml

      - name: Pass optional secrets to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
          OPENSKETCH_ACCESS_CODE: ${{ secrets.OPENSKETCH_ACCESS_CODE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BIZOMAT_ID_CLIENT_SECRET: ${{ secrets.BIZOMAT_ID_CLIENT_SECRET }}
        # NAME=VALUE lines on standard input (flyctl secrets import): never on a command line, never in the log; only the
        # names are printed.
        run: |
          lines=()
          if [ -n "$OPENSKETCH_ACCESS_CODE" ]; then lines+=("OPENSKETCH_ACCESS_CODE=$OPENSKETCH_ACCESS_CODE"); fi
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            lines+=("GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET")
          fi
          if [ -n "$BIZOMAT_ID_CLIENT_SECRET" ]; then lines+=("BIZOMAT_ID_CLIENT_SECRET=$BIZOMAT_ID_CLIENT_SECRET"); fi
          if [ "${#lines[@]}" -gt 0 ]; then
            printf '%s\n' "${lines[@]}" | flyctl secrets import --stage --app "$APP" > /dev/null
            echo "Staged on $APP: $(printf '%s\n' "${lines[@]}" | cut -d= -f1 | paste -sd ' ')"
          else
            echo "No optional secrets to pass."
          fi

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CADOS_TOKEN }}
        run: |
          flyctl deploy --app "$APP" --config fly.toml --remote-only --ha=false \
            --build-arg OPENSKETCH_VERSION="${GITHUB_SHA::7}" \
            --env OPENSKETCH_PUBLIC_URL="$PUBLIC_URL"

      # flyctl reports success once the machine runs, even when the server inside never answers (the supervisor keeps
      # the machine alive for a while): ask the site itself which version it serves
      - name: Check the live site
        run: |
          want="${GITHUB_SHA::7}"
          got=""
          for _ in $(seq 1 36); do
            got=$(curl -fsS --max-time 10 "https://$APP.fly.dev/healthz" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$got" = "$want" ]; then
              echo "CAD Automation $want is live at $PUBLIC_URL (origin https://$APP.fly.dev)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$APP.fly.dev/healthz did not answer with version $want within 3 minutes (last answer: ${got:-none}). See 'flyctl logs -a $APP'. To go back: 'flyctl releases -a $APP --image', then 'flyctl deploy -a $APP --image <the previous image> --ha=false'."
          exit 1

      # Sign in with BIZOMAT (opensketch/bizomat_id.py, docs/SITE-CAD-INTEGRATION.md section 8): with the secret set, the
      # sign-in page offers it, and BIZOMAT holds the SHA-256 of this repository's secret. The second is proved without
      # printing anything: BIZOMAT's token endpoint is asked to swap a made-up code with the client cad's credentials. The
      # same secret answers invalid_grant (400); another secret, or no client cad on BIZOMAT, answers invalid_client
      # (401). The secret reaches curl on standard input, never on a command line. Nothing is written on either side but a
      # rate-limit count.
      - name: Sign in with BIZOMAT (the secret is never printed)
        env:
          BIZOMAT_ID_CLIENT_SECRET: ${{ secrets.BIZOMAT_ID_CLIENT_SECRET }}
        run: |
          if [ -z "$BIZOMAT_ID_CLIENT_SECRET" ]; then
            echo "Sign in with BIZOMAT: BIZOMAT_ID_CLIENT_SECRET is not set in this repository, so it stays off." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          offered=0
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 15 -H 'Accept: text/html' "$PUBLIC_URL/login" | grep -q 'with BIZOMAT'; then offered=1; break; fi
            sleep 5
          done
          if [ "$offered" != 1 ]; then echo "::error::The sign-in page does not offer Sign in with BIZOMAT although the secret is set."; exit 1; fi
          code="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          verifier="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          answer="$(printf 'user = "cad:%s"\n' "$BIZOMAT_ID_CLIENT_SECRET" | curl -s -K - --max-time 15 -w '\n%{http_code}' \
            --data-urlencode grant_type=authorization_code --data-urlencode "code=$code" --data-urlencode "code_verifier=$verifier" \
            --data-urlencode redirect_uri=https://bizomat.ai/cad/auth/bizomat/callback https://bizomat.ai/company/api/id/token)"
          status="$(tail -n1 <<<"$answer")"; error="$(head -n -1 <<<"$answer" | jq -r '.error // empty' 2>/dev/null || true)"
          if [ "$status" = 400 ] && [ "$error" = invalid_grant ]; then
            echo "Sign in with BIZOMAT: offered on the sign-in page, and BIZOMAT holds this repository's secret (a made-up code was refused as invalid_grant)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::BIZOMAT does not take this repository's BIZOMAT_ID_CLIENT_SECRET (HTTP $status, ${error:-no error code}): the secret differs from kevinjogin/bizomat-site's, or bizomat has not been deployed with the client cad yet."
            exit 1
          fi
