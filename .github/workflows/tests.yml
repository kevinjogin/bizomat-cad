# Runs the test suite: pytest on Python 3.12 with the pinned requirements-dev.txt (the versions the server image
# installs), npm test on Node 20, and the Cloudflare Worker (cloudflare/mcp) on Node 22. On pull requests and on
# pushes to branches other than main; pushes to main are tested by deploy.yml, which calls this workflow and deploys
# only when every job here passes.
# The end-to-end worker tests (`@pytest.mark.slow`: real servers and worker processes, timing checks) run in a job
# of their own, so they have the runner to themselves.
name: Tests

on:
  pull_request:
    paths-ignore: ["docs/**", "*.md"]
  push:
    branches-ignore: [main]
    paths-ignore: ["docs/**", "*.md"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: main
            select: not slow
          - part: worker processes
            select: slow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # node runs the sketch solver (opensketch/solver)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      # .NET runs the C# companion and add-in link in the KEVOS end-to-end test (tests/test_bridge_e2e.py, slow job)
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: matrix.part == 'worker processes'
        with:
          dotnet-version: "8.0.x"
      - name: Libraries OpenCascade needs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgl1 libglu1-mesa libxrender1 libxext6 libx11-6
      - name: Python packages (exact versions)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q -ra --timeout=900 -m "${{ matrix.select }}"

  worker:
    name: Cloudflare Worker (cloudflare/mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/mcp/package-lock.json
      # the contract test runs opensketch/persist.py (standard library only) with the runner's python3
      - run: npm ci
      - run: npm run check

  npm:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
